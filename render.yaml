# ==============================================================================
# Render Blueprint Specification (render.yaml)
# Smart Water Management Backend (Web Service + Managed PostgreSQL)
# ==============================================================================

services:
  # 1. Node.js & Express REST / WebSocket Web Service
  - type: web
    name: smart-water-backend
    env: node
    plan: free
    region: oregon # or frankfurt, singapore, etc.
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smart-water-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        value: "*"
      # Set your HiveMQ Cloud cluster credentials in Render Dashboard:
      - key: MQTT_BROKER_URL
        sync: false # e.g. mqtts://your-cluster-id.s1.eu.hivemq.cloud:8883
      - key: MQTT_USERNAME
        sync: false # HiveMQ cluster username
      - key: MQTT_PASSWORD
        sync: false # HiveMQ cluster password

# 2. Render Managed PostgreSQL Database
databases:
  - name: smart-water-db
    plan: free
    region: oregon
    databaseName: smartwater
    user: smartwater_admin
